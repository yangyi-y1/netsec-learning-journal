name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add ECS to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to ECS
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='.git' \
            --exclude='.github' \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/home/${{ secrets.ECS_USER }}/app/
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} \
            "cd /home/${{ secrets.ECS_USER }}/app/docker-compose && docker compose up -d --build || echo 'docker compose skipped'"
