<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cssman.top</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
h1 { font-size: 2rem; margin-bottom: 10px; color: #00ff88; }
.sub { color: #888; margin-bottom: 40px; font-size: 0.95rem; }

.topic-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; margin-bottom: 16px; width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s; }
.topic-card:hover { border-color: #00ff88; }
.topic-info { flex: 1; }
.topic-name { font-size: 1.15rem; margin-bottom: 4px; }
.topic-count { font-size: 0.85rem; color: #888; }
.vote-btn { background: #00ff88; color: #0a0a0a; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.2s; }
.vote-btn:hover { background: #00cc6a; }
.vote-btn:active { transform: scale(0.95); }
.vote-btn.voted { background: #333; color: #00ff88; cursor: default; pointer-events: none; }

.add-section { margin-top: 40px; width: 100%; max-width: 480px; }
.add-section h2 { font-size: 1.2rem; margin-bottom: 12px; color: #aaa; }
.add-form { display: flex; gap: 10px; }
.add-form input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 1rem; outline: none; }
.add-form input:focus { border-color: #00ff88; }
.add-form button { background: #333; color: #fff; border: 1px solid #555; padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
.add-form button:hover { background: #444; }

.footer { margin-top: 60px; color: #555; font-size: 0.8rem; }
.footer a { color: #00ff88; text-decoration: none; }
</style>
</head>
<body>

<h1>cssman.top</h1>
<p class="sub">来都来了，投个票再走</p>

<div id="topics"></div>

<div class="add-section">
  <h2>+ 新建投票</h2>
  <div class="add-form">
    <input id="new-topic-name" type="text" placeholder="输入话题，例如：猫党" maxlength="100">
    <button onclick="createTopic()">创建</button>
  </div>
</div>

<div class="footer">
  powered by <a href="https://github.com/yangyi-y1/netsec-learning-journal" target="_blank">yangyi-y1</a>
</div>

<script>
const API = '/api/topics';

async function loadTopics() {
  const res = await fetch(API);
  const topics = await res.json();
  const voted = JSON.parse(localStorage.getItem('voted') || '[]');
  const container = document.getElementById('topics');
  container.innerHTML = topics.map(t => `
    <div class="topic-card" id="topic-${t.id}">
      <div class="topic-info">
        <div class="topic-name">${escapeHtml(t.name)}</div>
        <div class="topic-count">${t.count} 票</div>
      </div>
      <button class="vote-btn${voted.includes(t.id) ? ' voted' : ''}" onclick="vote(${t.id})">
        ${voted.includes(t.id) ? '已投' : '+1'}
      </button>
    </div>
  `).join('');
}

async function vote(id) {
  const voted = JSON.parse(localStorage.getItem('voted') || '[]');
  if (voted.includes(id)) return;
  const res = await fetch(API + '/' + id + '/vote', { method: 'POST' });
  if (!res.ok) return alert('投票失败，再试一次');
  const topic = await res.json();
  voted.push(id);
  localStorage.setItem('voted', JSON.stringify(voted));
  const card = document.getElementById('topic-' + id);
  card.querySelector('.topic-count').textContent = topic.count + ' 票';
  const btn = card.querySelector('.vote-btn');
  btn.textContent = '已投';
  btn.classList.add('voted');
}

async function createTopic() {
  const input = document.getElementById('new-topic-name');
  const name = input.value.trim();
  if (!name) return;
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  if (!res.ok) return alert('创建失败');
  input.value = '';
  localStorage.removeItem('voted');
  loadTopics();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

loadTopics();
</script>

</body>
</html>
